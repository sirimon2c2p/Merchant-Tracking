<script>

const LIFF_ID = "2011658045-4N77aswc";

const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyVWsp7-qk-XZXs5xRrjrVneqnGVzM-rRnERp4RPm8TPws0hd1pioTcCKCWu2AU06e2/exec";


let liffReady = false;


// =====================================================
// INIT LIFF
// =====================================================

async function initLIFF() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    console.log("LIFF initialized");

    liffReady = true;


    if (!liff.isLoggedIn()) {

      if (!liff.isInClient()) {

        liff.login();

        return;
      }

    }

  } catch (error) {

    console.error(
      "LIFF init error:",
      error
    );

    showError(
      "ไม่สามารถเชื่อมต่อกับ LINE ได้<br>" +
      "กรุณาลองใหม่อีกครั้ง"
    );

  }

}


// =====================================================
// SUBMIT
// =====================================================

async function submitForm() {

  const merchantIdInput =
    document.getElementById("merchantId");

  const submitBtn =
    document.getElementById("submitBtn");

  const loading =
    document.getElementById("loading");


  const merchantId =
    merchantIdInput.value.trim();


  if (!merchantId) {

    showError(
      "กรุณากรอก Merchant ID"
    );

    merchantIdInput.focus();

    return;

  }


  try {

    submitBtn.disabled = true;

    loading.style.display = "block";

    hideMessage();


    // =================================================
    // ตรวจ LIFF
    // =================================================

    if (!liffReady) {

      await liff.init({
        liffId: LIFF_ID
      });

      liffReady = true;

    }


    if (!liff.isLoggedIn()) {

      if (!liff.isInClient()) {

        liff.login();

        return;

      }

      throw new Error(
        "ไม่พบการเข้าสู่ระบบ LINE"
      );

    }


    // =================================================
    // ดึง LINE PROFILE
    // =================================================

    const profile =
      await liff.getProfile();


    console.log(
      "LINE User ID:",
      profile.userId
    );

    console.log(
      "Display Name:",
      profile.displayName
    );


    // =================================================
    // เตรียมข้อมูล
    // =================================================

    const data = {

      lineUserId:
        profile.userId,

      displayName:
        profile.displayName,

      merchantId:
        merchantId

    };


    console.log(
      "Data:",
      data
    );


    // =================================================
    // สร้าง FORM
    //
    // ไม่ใช้ fetch
    // ไม่ใช้ CORS
    // =================================================

    const iframe =
      document.createElement("iframe");

    iframe.name =
      "submitFrame";

    iframe.style.display =
      "none";


    document.body.appendChild(
      iframe
    );


    const form =
      document.createElement("form");


    form.method =
      "POST";


    form.action =
      GOOGLE_SCRIPT_URL;


    form.target =
      "submitFrame";


    form.style.display =
      "none";


    const input =
      document.createElement("input");


    input.type =
      "hidden";


    input.name =
      "data";


    input.value =
      JSON.stringify(data);


    form.appendChild(
      input
    );


    document.body.appendChild(
      form
    );


    // =================================================
    // ส่งข้อมูล
    // =================================================

    form.submit();


    console.log(
      "Form submitted to Apps Script"
    );


    // =================================================
    // รอให้ Apps Script ทำงาน
    // =================================================

    setTimeout(
      function() {

        loading.style.display =
          "none";


        document
          .getElementById("formArea")
          .style.display =
          "none";


        showSuccess(
          "เชื่อมบัญชีสำเร็จ<br>" +
          "Merchant ID ถูกบันทึกเรียบร้อยแล้ว"
        );


        // ล้าง iframe/form
        setTimeout(
          function() {

            form.remove();

            iframe.remove();

          },
          3000
        );


      },
      1500
    );


  } catch (error) {

    console.error(
      "Submit error:",
      error
    );


    loading.style.display =
      "none";


    submitBtn.disabled =
      false;


    showError(
      "ไม่สามารถบันทึกข้อมูลได้<br>" +
      "กรุณาลองใหม่อีกครั้ง"
    );

  }

}


// =====================================================
// MESSAGE
// =====================================================

function showSuccess(text) {

  const message =
    document.getElementById("message");

  message.innerHTML =
    text;

  message.className =
    "success";

  message.style.display =
    "block";

}


function showError(text) {

  const message =
    document.getElementById("message");

  message.innerHTML =
    text;

  message.className =
    "error";

  message.style.display =
    "block";

}


function hideMessage() {

  const message =
    document.getElementById("message");

  message.style.display =
    "none";

}


// =====================================================
// START
// =====================================================

initLIFF();

</script>
