<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Merchant Tracking</title>


  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 20px;

      background: #f7f7f7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .card {

      width: 100%;

      max-width: 400px;

      padding: 32px 24px;

      background: #ffffff;

      border-radius: 18px;

      box-shadow:
        0 4px 20px rgba(0,0,0,0.08);

    }


    h1 {

      margin: 0 0 10px;

      text-align: center;

      font-size: 24px;

      color: #222;

    }


    .description {

      margin: 0 0 28px;

      text-align: center;

      font-size: 15px;

      line-height: 1.6;

      color: #666;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

      color: #333;

    }


    input {

      width: 100%;

      height: 48px;

      padding: 0 14px;

      border: 1px solid #ddd;

      border-radius: 10px;

      outline: none;

      font-size: 16px;

    }


    input:focus {

      border-color: #06C755;

    }


    button {

      width: 100%;

      height: 48px;

      margin-top: 18px;

      border: 0;

      border-radius: 10px;

      background: #06C755;

      color: #fff;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    #loading {

      display: none;

      margin-top: 16px;

      text-align: center;

      font-size: 14px;

      color: #666;

    }


    .spinner {

      display: inline-block;

      width: 16px;

      height: 16px;

      margin-right: 6px;

      vertical-align: -3px;

      border: 2px solid #ddd;

      border-top-color: #06C755;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    #message {

      display: none;

      margin-top: 18px;

      padding: 14px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      line-height: 1.6;

    }


    #message.success {

      display: block;

      background: #eefaf2;

      color: #16833a;

    }


    #message.error {

      display: block;

      background: #fff1f1;

      color: #c62828;

    }

  </style>

</head>


<body>


  <div class="card">


    <h1>
      เชื่อมบัญชีร้านค้า
    </h1>


    <p class="description">
      กรุณากรอก Merchant ID<br>
      เพื่อเชื่อมบัญชีร้านค้าของคุณกับ LINE OA
    </p>


    <div id="formArea">


      <label for="merchantId">
        Merchant ID
      </label>


      <input
        id="merchantId"
        type="text"
        placeholder="กรอก Merchant ID"
        autocomplete="off"
      >


      <button
        id="submitBtn"
        onclick="submitForm()"
      >
        ยืนยันข้อมูล
      </button>


      <div id="loading">

        <span class="spinner"></span>

        กำลังบันทึกข้อมูล...

      </div>


    </div>


    <div id="message"></div>


  </div>



  <script>


    // =================================================
    // CONFIG
    // =================================================

    const LIFF_ID =
      "2011658045-4N77aswc";


    // =================================================
    // สำคัญมาก
    //
    // เอา Web App URL จาก Google Apps Script
    // มาใส่ตรงนี้
    // =================================================

    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyVWsp7-qk-XZXs5xRrjrVneqnGVzM-rRnERp4RPm8TPws0hd1pioTcCKCWu2AU06e2/exec";


    // =================================================
    // INIT LIFF
    // =================================================

    async function initLIFF() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        console.log(
          "LIFF initialized"
        );


        if (!liff.isLoggedIn()) {

          if (!liff.isInClient()) {

            liff.login();

            return;

          }

        }


      } catch (error) {

        console.error(
          "LIFF init error:",
          error
        );


        showError(
          "ไม่สามารถเชื่อมต่อกับ LINE ได้<br>" +
          "กรุณาลองใหม่อีกครั้ง"
        );

      }

    }


    // =================================================
    // SUBMIT
    // =================================================

    async function submitForm() {


      const merchantId =
        document
          .getElementById("merchantId")
          .value
          .trim();


      const button =
        document
          .getElementById("submitBtn");


      const loading =
        document
          .getElementById("loading");


      // -------------------------------
      // Validate
      // -------------------------------

      if (!merchantId) {

        showError(
          "กรุณากรอก Merchant ID"
        );

        return;

      }


      try {


        button.disabled = true;

        loading.style.display =
          "block";

        hideMessage();


        // -------------------------------
        // ตรวจ Login
        // -------------------------------

        if (!liff.isLoggedIn()) {

          if (!liff.isInClient()) {

            liff.login();

            return;

          }

          throw new Error(
            "ไม่พบ LINE User"
          );

        }


        // -------------------------------
        // Get Profile
        // -------------------------------

        const profile =
          await liff.getProfile();


        console.log(
          "LINE User ID:",
          profile.userId
        );


        console.log(
          "Display Name:",
          profile.displayName
        );


        // -------------------------------
        // สร้าง Form
        // -------------------------------

        const form =
          document.createElement("form");


        form.method = "POST";

        form.action =
          GOOGLE_SCRIPT_URL;

        form.target =
          "_blank";


        form.style.display =
          "none";


        // Merchant ID

        const merchantInput =
          document.createElement("input");

        merchantInput.type =
          "hidden";

        merchantInput.name =
          "merchantId";

        merchantInput.value =
          merchantId;


        // LINE User ID

        const userInput =
          document.createElement("input");

        userInput.type =
          "hidden";

        userInput.name =
          "lineUserId";

        userInput.value =
          profile.userId;


        // Display Name

        const nameInput =
          document.createElement("input");

        nameInput.type =
          "hidden";

        nameInput.name =
          "displayName";

        nameInput.value =
          profile.displayName;


        form.appendChild(
          merchantInput
        );

        form.appendChild(
          userInput
        );

        form.appendChild(
          nameInput
        );


        document.body.appendChild(
          form
        );


        // -------------------------------
        // ส่งข้อมูล
        // -------------------------------

        form.submit();


        console.log(
          "Data submitted"
        );


        // -------------------------------
        // แสดง Success
        // -------------------------------

        setTimeout(
          function() {

            loading.style.display =
              "none";


            document
              .getElementById("formArea")
              .style.display =
              "none";


            showSuccess(
              "เชื่อมบัญชีสำเร็จ<br>" +
              "Merchant ID ถูกบันทึกเรียบร้อยแล้ว"
            );

          },
          1000
        );


      } catch (error) {


        console.error(
          "Submit error:",
          error
        );


        loading.style.display =
          "none";


        button.disabled =
          false;


        showError(
          "ไม่สามารถบันทึกข้อมูลได้<br>" +
          error.message
        );

      }

    }


    // =================================================
    // MESSAGE
    // =================================================

    function showSuccess(text) {

      const message =
        document.getElementById(
          "message"
        );


      message.innerHTML =
        text;


      message.className =
        "success";


      message.style.display =
        "block";

    }


    function showError(text) {

      const message =
        document.getElementById(
          "message"
        );


      message.innerHTML =
        text;


      message.className =
        "error";


      message.style.display =
        "block";

    }


    function hideMessage() {

      const message =
        document.getElementById(
          "message"
        );


      message.style.display =
        "none";

    }


    // =================================================
    // START
    // =================================================

    initLIFF();

  </script>


</body>

</html>
